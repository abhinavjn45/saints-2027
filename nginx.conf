server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # Serve the home file directly so the index module never redirects / to /index.html.
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /index.html { return 301 /$is_args$args; }
  location ~ ^/(?<page>abstract|committee|registration|track)(\.html|/)$ {
    return 301 /$page$is_args$args;
  }

  # pages: always revalidate so a deploy shows up straight away
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # css and js are not fingerprinted, so always revalidate (cheap 304 via ETag).
  # A long cache here let a phone pair fresh HTML with an hour-old stylesheet,
  # which showed new markup unstyled (e.g. the nav event label).
  location ~* ^/assets/.*\.(css|js)$ {
    add_header Cache-Control "no-cache";
  }

  # images and other assets: cache for an hour
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
  }

  # never serve source or build files
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(Dockerfile|nginx\.conf|fly\.toml|package.*\.json|tailwind\.config\.js|tools/|README\.md) { return 404; }

  # a real 404 status, so broken links are not indexed as copies of the home page
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache"; }
}
